# Nginx — PHASE 1 (HTTP only) for WebAIAutomation (Next.js on 127.0.0.1:3000).
#
# Used only until the Let's Encrypt certificate exists (guide step 17). After
# that it is replaced by webaiautomation-https.conf.
# Install: sudo cp deploy/nginx/webaiautomation.conf /etc/nginx/sites-available/webaiautomation
#          sudo ln -s /etc/nginx/sites-available/webaiautomation /etc/nginx/sites-enabled/webaiautomation

upstream webaiautomation_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Catch-all: requests for any other host name (e.g. scanners using the raw IP)
# get no response at all.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name webaiautomation.com www.webaiautomation.com;

    # Server Actions accept up to 1 MB; keep nginx slightly above that.
    client_max_body_size 2m;

    # Don't advertise the nginx version.
    server_tokens off;

    location / {
        proxy_pass http://webaiautomation_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # Overwrite (don't append) client IP headers: the app rate-limits by
        # X-Real-IP, so a visitor must not be able to supply their own value.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
    }
}

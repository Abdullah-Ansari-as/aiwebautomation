# Nginx — PHASE 2 (final, HTTPS) for WebAIAutomation (Next.js on 127.0.0.1:3000).
#
# Requires the certificate from: certbot certonly --nginx -d webaiautomation.com -d www.webaiautomation.com
# Install: sudo cp deploy/nginx/webaiautomation-https.conf /etc/nginx/sites-available/webaiautomation
#          sudo nginx -t && sudo systemctl reload nginx
#
# Canonical host: https://webaiautomation.com
#   http://webaiautomation.com, http://www… and https://www… all 301 → https://webaiautomation.com
# Let's Encrypt renewals keep working: certbot temporarily adds an exact-match
# /.well-known/acme-challenge/ location to the port-80 server, which takes
# precedence over the redirect.

upstream webaiautomation_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# Catch-all: unknown host names / raw-IP requests
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;                 # close the connection without a response
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;    # no certificate is revealed for unknown names
}

# ---------------------------------------------------------------------------
# HTTP → HTTPS (both names) and https://www → https://apex
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name webaiautomation.com www.webaiautomation.com;
    server_tokens off;

    location / {
        return 301 https://webaiautomation.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.webaiautomation.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/webaiautomation.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webaiautomation.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WAA_SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://webaiautomation.com$request_uri;
}

# ---------------------------------------------------------------------------
# The site
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name webaiautomation.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/webaiautomation.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webaiautomation.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WAA_SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: uncomment once https://webaiautomation.com works for you (guide step 17.4).
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Server Actions accept up to 1 MB; keep nginx slightly above that.
    client_max_body_size 2m;

    # While the app is stopped (maintenance) or restarting, show a short
    # "back soon" page with 503 instead of a bare 502.
    error_page 502 503 504 = @maintenance;

    location / {
        proxy_pass http://webaiautomation_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # Overwrite (don't append) client IP headers: the app rate-limits by
        # X-Real-IP, so a visitor must not be able to supply their own value.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
    }

    location @maintenance {
        default_type text/html;
        add_header Retry-After 300 always;
        add_header Cache-Control "no-store" always;
        return 503 '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Back soon | WebAIAutomation</title><body style="font-family:system-ui,sans-serif;max-width:32rem;margin:15vh auto;padding:0 1rem;text-align:center;color:#111"><h1>We&rsquo;ll be right back</h1><p>WebAIAutomation is being updated. Please try again in a few minutes.</p></body></html>';
    }
}
